<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShopSafe - Everyday essentials{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav class="navbar container">
            <a href="{{ url_for('index') }}" class="logo">ShopSafe</a>
            <form class="search-box" action="{{ url_for('products') }}" method="get">
                <input type="text" name="q" placeholder="Search products..." value="{{ request.args.get('q', '') }}">
                <button type="submit">Search</button>
            </form>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('products') }}">Products</a></li>
                <li><a href="{{ url_for('category', category_name='Electronics') }}">Categories</a></li>
                <li><a href="{{ url_for('cart') }}">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>About</h3>
                    <a href="{{ url_for('about') }}">About Us</a>
                    <a href="{{ url_for('contact') }}">Contact</a>
                </div>
                <div class="footer-section">
                    <h3>Help</h3>
                    <a href="{{ url_for('contact') }}">Support</a>
                    <a href="{{ url_for('privacy') }}">FAQs</a>
                </div>
                <div class="footer-section">
                    <h3>Legal</h3>
                    <a href="{{ url_for('privacy') }}">Privacy Policy</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 ShopSafe. All rights reserved. | Everyday essentials. Shopping made simple.</p>
            </div>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
</body>
</html>
